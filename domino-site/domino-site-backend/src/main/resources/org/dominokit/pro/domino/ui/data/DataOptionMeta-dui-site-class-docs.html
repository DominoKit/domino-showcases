Metadata holder used to associate rendered content with a selected option in a virtualized data
component.

<p><code>DataOptionMeta</code> is used by <a class="dui" tabindex="0" aria-expanded="true"
target="_blank"
href="https://www.javadoc.io/doc/org.dominokit/domino-ui-pro/latest/org/dominokit/pro/domino/ui/data/DataSelect.html">DataSelect</a>
to keep the selected-value node attached to the active option and to remove that node cleanly when
selection changes.
